<style>

*{box-sizing:border-box}
button,input,textarea,select{font-family:inherit}
html,body{height:100%;margin:0;overflow-x:hidden;overscroll-behavior-x:none}
body{background:var(--bg);color:var(--navy);font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:560px;margin:0 auto}
#app{height:100%;display:flex;flex-direction:column}

main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none;touch-action:pan-y;padding:6px 20px 24px}

main>*{max-width:100%}
#app{overflow-x:hidden;background:var(--bg)}

nav{display:flex;gap:4px;background:var(--bg);border-top:1px solid var(--bd);padding:2px 6px calc(2px + env(safe-area-inset-bottom,0px))}

.btn{background:var(--card);color:var(--navy);border:1.5px solid var(--ln);border-radius:24px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}

input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy)}

.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
